name: Windows
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
        working-directory: Windows workspace/Noiseless
    steps:
      - uses: actions/checkout@v4
        with:
          path: Windows workspace/Noiseless
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Maven bootstrap and Java suite
        run: |
          .\mvnw.cmd -B verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows app with bundled runtime
        run: .\scripts\package-desktop.ps1 -SkipBuild
      - name: Verify packaged backend and desktop startup
        run: .\scripts\test-windows-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            Windows workspace/Noiseless/target/surefire-reports/
            Windows workspace/Noiseless/target/windows-verification/*.json
            Windows workspace/Noiseless/target/windows-verification/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Noiseless-windows
          path: Windows workspace/Noiseless/target/native/Noiseless-windows.zip
          if-no-files-found: error
